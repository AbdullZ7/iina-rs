[package]
name = "iina-rs"
version = "0.3.0"
edition = "2021"
description = "Cross-platform (Windows/Linux) media player inspired by IINA, built on libmpv"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
libloading = "0.8"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
egui = "0.32"
egui-winit = "0.32"
egui_glow = { version = "0.32", features = ["winit"] }
glow = "0.16"
egui_extras = { version = "0.32", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "6"
ureq = { version = "2", features = ["json"] }
rand = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
ar-reshaper = "1.5.0"
unicode-bidi = "0.3.18"
sys-locale = "0.3.2"
ash = "0.38"
ash-window = "0.13"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.60", features = ["Win32_UI_Shell"] }
windows = { version = "0.61", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Devices_Display"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - name: Fetch libmpv (slim build from libmpv.yml, else shinchiro's full one)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow libmpv.yml --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n libmpv-slim -D mpv-dev; then
            echo "libmpv: slim build from run $run, mpv $(cat mpv-dev/mpv-version.txt)"
          else
            echo "::warning::slim libmpv unavailable, using shinchiro's full build"
            url=$(gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest \
              --jq '.assets[] | select(.name|test("^mpv-dev-x86_64-[0-9]")) | .browser_download_url' | head -1)
            curl -sL -o mpv-dev.7z "$url"
            7z x mpv-dev.7z -ompv-dev -y > /dev/null
          fi
          ls -l mpv-dev/libmpv-2.dll
      - run: python scripts/package.py windows target/release/iina-rs.exe mpv-dev/libmpv-2.dll dist
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          "Inno Setup " + (Get-Item $iscc).VersionInfo.ProductVersion
          if (-not (Test-Path (Join-Path (Split-Path $iscc) "Languages\Arabic.isl"))) { throw "Inno Setup has no Arabic.isl (needs 6.4+)" }
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item target/release/iina-rs.exe, mpv-dev/libmpv-2.dll pkg/
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$ver" "/DSrcDir=$PWD\pkg" "/DOutDir=$PWD\dist" scripts\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test the installer (silent install, Open with, uninstall)
        shell: pwsh
        run: |
          $setup = (Get-Item dist\*-setup.exe).FullName
          $dir = "$env:RUNNER_TEMP\iina-rs-test"
          Start-Process $setup -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=$dir", "/TASKS=assoc"
          foreach ($f in "iina-rs.exe", "libmpv-2.dll", "unins000.exe") { if (-not (Test-Path "$dir\$f")) { throw "missing $f" } }
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\Applications\iina-rs.exe\shell\open\command").'(default)'
          if ($cmd -notlike "*$dir*") { throw "Open with not registered: $cmd" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\IINA-RS.lnk")) { throw "no Start menu shortcut" }
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          Start-Sleep 5
          if (Test-Path "$dir\iina-rs.exe") { throw "not uninstalled" }
          if (Test-Path "HKCU:\Software\Classes\Applications\iina-rs.exe") { throw "Open with left behind" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\IINA-RS.lnk") { throw "shortcut left behind" }
          "installer OK"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libmpv-dev
      - run: cargo test --release
      - run: cargo build --release
      - run: python3 scripts/package.py linux target/release/iina-rs dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install mpv dylibbundler
      - run: cargo test --release
      - run: cargo build --release
      - run: python3 scripts/package.py macos target/release/iina-rs "$(brew --prefix)/lib/libmpv.2.dylib" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Release notes: docs/releases/<tag>.md (the release fails without
      # them, so a version can't go out undescribed).
      - run: test -s "docs/releases/${GITHUB_REF_NAME}.md"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/releases/${{ github.ref_name }}.md
